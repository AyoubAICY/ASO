[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aso-security"
version = "0.1.2"
description = "Security orchestration library for AI agents, memory, tools, and secrets"
readme = "docs/pypi_landing.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "regex>=2024.5.15",
  "numpy>=1.26",
  "chardet>=5.2",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
]
authors = [
  { name = "ASO Contributors" }
]
license = "Apache-2.0"
keywords = [
  "ai",
  "security",
  "agents",
  "orchestration",
  "memory",
  "tools",
  "secrets",
  "guardrail",
  "llm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/AyoubStudent/ASO"
Repository = "https://github.com/AyoubStudent/ASO"
Documentation = "https://github.com/AyoubStudent/ASO/tree/main/docs"
Issues = "https://github.com/AyoubStudent/ASO/issues"

[project.optional-dependencies]
openai = ["openai>=1.0.0", "langchain-openai>=0.2.0"]
google = ["google-genai>=0.1.0", "langchain-google-genai>=2.0.0"]
huggingface = ["transformers>=4.37", "langchain-huggingface>=0.1.0", "torch>=2.2"]
ollama = ["langchain-ollama>=0.2.0"]
langchain = ["langchain-core>=0.2.0"]
memory-qdrant = ["qdrant-client>=1.9"]
memory-pinecone = ["pinecone>=5"]
memory-weaviate = ["weaviate-client>=4"]
memory-milvus = ["pymilvus>=2.4"]
memory-chroma = ["chromadb>=0.5"]
memory-faiss = ["faiss-cpu>=1.8; platform_system != 'Windows'", "numpy>=1.26"]
memory-sql = ["sqlalchemy>=2.0"]
memory-postgresql = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
memory-pgvector = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pgvector>=0.3"]
memory-oracle = ["sqlalchemy>=2.0", "oracledb>=2.0"]
memory-sqlserver = ["sqlalchemy>=2.0", "pyodbc>=5.0"]
memory-mariadb = ["sqlalchemy>=2.0", "mariadb>=1.1"]
memory-mongodb = ["pymongo>=4.6"]
memory-couchdb = ["CouchDB>=1.2"]
memory-firestore = ["google-cloud-firestore>=2.14"]
memory-dynamodb = ["boto3>=1.34"]
memory-redis = ["redis>=5.0"]
memory-valkey = ["valkey>=6.0"]
memory-memcached = ["pymemcache>=4.0"]
memory-neo4j = ["neo4j>=5.18"]
memory-neptune = ["neo4j>=5.18"]
memory-arango = ["python-arango>=7.7"]
memory-tigergraph = ["pyTigerGraph>=1.7"]
memory-langgraph = ["langgraph>=0.2"]
memory-elasticsearch = ["elasticsearch>=8.12"]
memory-opensearch = ["opensearch-py>=2.4"]
memory-solr = ["pysolr>=3.9"]
memory-s3 = ["boto3>=1.34"]
memory-gcs = ["google-cloud-storage>=2.14"]
memory-azure = ["azure-storage-blob>=12.19"]
memory-yaml = ["PyYAML>=6.0"]
all = [
  "openai>=1.0.0",
  "langchain-openai>=0.2.0",
  "google-genai>=0.1.0",
  "langchain-google-genai>=2.0.0",
  "transformers>=4.37",
  "langchain-huggingface>=0.1.0",
  "torch>=2.2",
  "langchain-ollama>=0.2.0",
  "langchain-core>=0.2.0",
]
memory-all = [
  "qdrant-client>=1.9",
  "pinecone>=5",
  "weaviate-client>=4",
  "pymilvus>=2.4",
  "chromadb>=0.5",
  "faiss-cpu>=1.8; platform_system != 'Windows'",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "oracledb>=2.0",
  "pyodbc>=5.0",
  "mariadb>=1.1",
  "pymongo>=4.6",
  "CouchDB>=1.2",
  "google-cloud-firestore>=2.14",
  "boto3>=1.34",
  "redis>=5.0",
  "valkey>=6.0",
  "pymemcache>=4.0",
  "neo4j>=5.18",
  "python-arango>=7.7",
  "pyTigerGraph>=1.7",
  "langgraph>=0.2",
  "elasticsearch>=8.12",
  "opensearch-py>=2.4",
  "pysolr>=3.9",
  "google-cloud-storage>=2.14",
  "azure-storage-blob>=12.19",
  "PyYAML>=6.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "build>=1.2.0",
  "twine>=5.1.0",
]

[tool.setuptools]
include-package-data = true
packages = ["aso", "DecisionEngine", "MemoryGuard", "PromptGuard", "ToolGuard", "SecretGuard"]

[tool.setuptools.package-dir]
aso = "src/aso"
DecisionEngine = "DecisionEngine"
MemoryGuard = "MemoryGuard"
PromptGuard = "PromptGuard"
ToolGuard = "ToolGuard"
SecretGuard = "SecretGuard"
